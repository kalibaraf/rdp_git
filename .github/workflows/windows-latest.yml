name: WINDOWS LATEST RDP

on:
  workflow_dispatch:
    inputs:
      increment:
        type: string
        description: 'ngrok token'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Run Setup Script (start.bat)
        shell: pwsh
        run: |
          .\start.bat "Bore-Tunnel" "rdpuser" "OLDUSER#06" "Latest"

      - name: 🚀 Start Bore Tunnel (Bulletproof)
        shell: pwsh
        run: |
          Write-Host "📥 Downloading Bore Tunnel..."
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-pc-windows-msvc.zip" -OutFile "bore.zip"
          Expand-Archive "bore.zip" -DestinationPath "."
          
          Write-Host "================================================"
          Write-Host "✅ SYSTEM ACTIVE! RDP IS READY TO CONNECT"
          Write-Host "Username: rdpuser"
          Write-Host "Password: OLDUSER#06"
          Write-Host "================================================"
          Write-Host "⏳ Tunnel starting... Look for 'listening at bore.pub:XXXXX' below:"
          
          .\bore.exe local 3389 --to bore.pub
