name: WINDOWS LATEST RDP

on:
  workflow_dispatch:
    inputs:
      increment:
        type: string
        description: 'ngrok token'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Run Setup Script (start.bat)
        shell: pwsh
        run: |
          .\start.bat "Pinggy-Tunnel" "administrator" "OLDUSER#06" "Latest"

      - name: 🚀 Start Pinggy Tunnel
        shell: pwsh
        run: |
          Write-Host "✅ SYSTEM ACTIVE: Check the terminal output below for your Pinggy TCP address and port!"
          ssh -p 443 -R0:localhost:3389 -o StrictHostKeyChecking=no a.pinggy.io
