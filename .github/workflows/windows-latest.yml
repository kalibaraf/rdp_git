name: WINDOWS LATEST RDP

on:
  workflow_dispatch:
    inputs:
      increment:
        type: string
        description: 'ngrok token'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Run Setup Script (start.bat)
        shell: pwsh
        run: |
          .\start.bat "Pinggy-Tunnel" "rdpuser" "OLDUSER#06" "Latest"

      - name: 🚀 Start Pinggy Tunnel (Live Console)
        shell: cmd
        run: |
          echo ================================================
          echo ✅ SYSTEM ACTIVE! RDP IS READY TO CONNECT
          echo Username: rdpuser
          echo Password: OLDUSER#06
          echo ================================================
          echo ⏳ Connecting to Pinggy... Wait 5-10 seconds for the URL to appear below:
          ssh -p 443 -R0:localhost:3389 -o StrictHostKeyChecking=no a.pinggy.io
