name: WINDOWS LATEST RDP

on:
  workflow_dispatch:
    inputs:
      increment:
        type: string
        description: 'ngrok token'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Run Setup Script (start.bat)
        shell: pwsh
        run: |
          .\start.bat "Serveo-Tunnel" "rdpuser" "OLDUSER#06" "Latest"

      - name: 🚀 Start Serveo Tunnel (Headless)
        shell: cmd
        run: |
          echo ================================================
          echo ✅ SYSTEM ACTIVE! RDP IS READY TO CONNECT
          echo Username: rdpuser
          echo Password: OLDUSER#06
          echo ================================================
          echo ⏳ Fetching TCP link from Serveo... Wait a few seconds:
          ssh -o StrictHostKeyChecking=no -R 0:localhost:3389 serveo.net
